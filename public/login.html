<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | InfraView</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page bg-body-tertiary">

    <main class="auth-card card shadow-sm border-0 p-4 login-card-anim">
        <form id="loginForm" novalidate>
            <div class="text-center mb-4">
                <div class="login-brand-icon"><i class="bi bi-hdd-network"></i></div>
                <h1 class="h3 mb-3 fw-normal">InfraView</h1>
                <p class="text-muted">Monitoramento de Infraestrutura &amp; IoT &middot; Faça login para acessar o painel</p>
            </div>

            <!-- Mensagens: sessão expirada, senha errada, servidor fora do ar... (preenchido pelo js/login.js) -->
            <div id="formMessage" class="alert d-none" role="alert"></div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" autocomplete="username" required>
                <label for="email">E-mail</label>
                <div class="invalid-feedback"></div>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" name="password" placeholder="Senha" autocomplete="current-password" required>
                <label for="password">Senha</label>
                <div class="invalid-feedback"></div>
            </div>

            <button id="loginButton" class="btn btn-primary w-100 py-2 fw-bold" type="submit">Entrar no painel</button>

            <p class="text-center small mt-3 mb-0">
                Não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </p>

            <div class="text-center mt-4">
                <small class="text-muted">Equipe: Vinícius, Bruno e Arthur</small>
            </div>
        </form>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
