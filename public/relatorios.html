<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Relatórios e Logs | InfraView</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

    <!-- O cabeçalho e o menu lateral são montados pelo js/layout.js, com o usuário logado.
         Até a sessão ser confirmada, aparece só este "Carregando...". -->
    <div class="page-loader" role="status">
        <div class="spinner-border text-primary mb-2" aria-hidden="true"></div>
        <div>Carregando...</div>
    </div>

    <main class="container-fluid px-4">
        <div class="page-header">
            <div>
                <h1 class="page-title"><i class="bi bi-file-earmark-bar-graph me-2 text-custom" aria-hidden="true"></i>Relatórios e Logs</h1>
                <p class="page-subtitle mb-0">Histórico de quedas, picos de latência e perda de pacotes</p>
            </div>
        </div>

        <!-- Filtros: mudar qualquer um busca de novo na hora -->
        <form class="card mb-4" id="filters">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-4">
                        <label for="filterPeriod" class="filter-label">Período</label>
                        <select id="filterPeriod" name="period" class="form-select form-select-sm">
                            <option value="0">Últimas 24 horas</option>
                            <option value="7" selected>Últimos 7 dias</option>
                            <option value="30">Últimos 30 dias</option>
                            <option value="all">Tudo</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="filterDevice" class="filter-label">Dispositivo</label>
                        <select id="filterDevice" name="device" class="form-select form-select-sm">
                            <option value="">Todos os dispositivos</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="filterType" class="filter-label">Tipo de evento</label>
                        <select id="filterType" name="type" class="form-select form-select-sm">
                            <option value="todos" selected>Todos</option>
                            <option value="downtime">Quedas</option>
                            <option value="latencia">Picos de latência</option>
                            <option value="perda">Perda de pacotes</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex flex-wrap justify-content-between gap-2 mt-3">
                    <div class="results-count" id="eventSummary" aria-live="polite"></div>
                    <div class="results-count" id="updateStatus" aria-live="polite"></div>
                </div>
            </div>
        </form>

        <!-- Esqueleto e erro da primeira carga -->
        <div id="reportState"></div>

        <section class="card mb-4" id="downtimeCard" aria-labelledby="downtimeTitle" hidden>
            <div class="card-header">
                <h2 class="section-title" id="downtimeTitle"><i class="bi bi-wifi-off me-2 text-custom" aria-hidden="true"></i>Quedas (downtime)</h2>
                <span class="count-badge" id="downtimeCount"></span>
            </div>
            <div class="card-body p-0" id="downtimeTable"></div>
        </section>

        <section class="card mb-4" id="latencyCard" aria-labelledby="latencyTitle" hidden>
            <div class="card-header">
                <h2 class="section-title" id="latencyTitle"><i class="bi bi-graph-up-arrow me-2 text-custom" aria-hidden="true"></i>Picos de latência</h2>
                <span class="count-badge" id="latencyCount"></span>
            </div>
            <div class="card-body p-0" id="latencyTable"></div>
        </section>

        <section class="card mb-4" id="lossCard" aria-labelledby="lossTitle" hidden>
            <div class="card-header">
                <h2 class="section-title" id="lossTitle"><i class="bi bi-reception-1 me-2 text-custom" aria-hidden="true"></i>Perda de pacotes</h2>
                <span class="count-badge" id="lossCount"></span>
            </div>
            <div class="card-body p-0" id="lossTable"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/relatorios.js"></script>
</body>
</html>
