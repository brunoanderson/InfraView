<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Alertas | InfraView</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

    <!-- O cabeçalho e o menu lateral são montados pelo js/layout.js, com o usuário logado.
         Até a sessão ser confirmada, aparece só este "Carregando...". -->
    <div class="page-loader" role="status">
        <div class="spinner-border text-primary mb-2" aria-hidden="true"></div>
        <div>Carregando...</div>
    </div>

    <main class="container-fluid px-4">
        <div class="page-header">
            <div>
                <h1 class="page-title"><i class="bi bi-bell me-2 text-custom" aria-hidden="true"></i>Alertas</h1>
                <p class="page-subtitle mb-0">Gerados automaticamente pelo monitor: quedas, latência alta e perda de pacotes</p>
            </div>
            <div id="alertBadges" class="d-flex flex-wrap gap-2"></div>
        </div>

        <!-- Filtros -->
        <div class="d-flex flex-wrap gap-4 mb-2">
            <div>
                <div class="filter-label label-caps" id="kindFilterLabel">Tipo</div>
                <div id="kindFilter" class="d-flex flex-wrap gap-2" aria-labelledby="kindFilterLabel"></div>
            </div>
            <div>
                <div class="filter-label label-caps" id="statusFilterLabel">Situação</div>
                <div id="statusFilter" class="d-flex flex-wrap gap-2" aria-labelledby="statusFilterLabel"></div>
            </div>
        </div>
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
            <div class="results-count" id="resultsCount" aria-live="polite"></div>
            <div class="results-count" id="updateStatus" aria-live="polite"></div>
        </div>

        <section class="card mb-4" aria-labelledby="alertListTitle">
            <div class="card-header">
                <h2 class="section-title" id="alertListTitle"><i class="bi bi-list-ul me-2 text-custom" aria-hidden="true"></i>Alertas</h2>
            </div>
            <div class="card-body p-0 timeline" id="alertList"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/alertas.js"></script>
</body>
</html>
