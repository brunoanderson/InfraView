<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede | InfraView</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

    <!-- O cabeçalho e o menu lateral são montados pelo js/layout.js, com o usuário logado.
         Até a sessão ser confirmada, aparece só este "Carregando...". -->
    <div class="page-loader" role="status">
        <div class="spinner-border text-primary mb-2" aria-hidden="true"></div>
        <div>Carregando...</div>
    </div>

    <main class="container-fluid px-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h4 class="text-light mb-1"><i class="bi bi-diagram-3 me-2 text-custom"></i>Rede</h4>
                <span class="text-custom small">Todos os dispositivos conectados na LAN, por categoria</span>
            </div>
            <!-- Só para admin: o js/layout.js esconde para quem é viewer (o back-end também recusa com 403) -->
            <button type="button" class="btn btn-primary btn-sm" data-admin-only disabled title="Disponível na próxima etapa">
                <i class="bi bi-plus-lg me-1"></i>Novo dispositivo
            </button>
        </div>

        <div class="card shadow-sm anim-card">
            <div class="card-body" id="pageContent">
                <div class="empty-state">
                    <i class="bi bi-cone-striped"></i>
                    <div class="fw-semibold text-light mb-1">Em construção</div>
                    <div class="small">A lista de dispositivos, com latência e perda medidas pelo monitor, será ligada à API na próxima etapa.</div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/rede.js"></script>
</body>
</html>
