<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Rede | InfraView</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">

    <!-- O cabeçalho e o menu lateral são montados pelo js/layout.js, com o usuário logado.
         Até a sessão ser confirmada, aparece só este "Carregando...". -->
    <div class="page-loader" role="status">
        <div class="spinner-border text-primary mb-2" aria-hidden="true"></div>
        <div>Carregando...</div>
    </div>

    <main class="container-fluid px-4">
        <div class="page-header">
            <div>
                <h1 class="page-title"><i class="bi bi-diagram-3 me-2 text-custom" aria-hidden="true"></i>Rede</h1>
                <p class="page-subtitle mb-0">Todos os dispositivos monitorados, por categoria</p>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2">
                <div id="statusBadges" class="d-flex flex-wrap gap-2"></div>
                <!-- Só para admin: o js/layout.js esconde para quem é viewer (o back-end também recusa com 403) -->
                <button type="button" id="newDeviceButton" class="btn btn-primary btn-sm" data-admin-only>
                    <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Novo dispositivo
                </button>
            </div>
        </div>

        <!-- Filtros + busca -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-2">
            <div id="statusFilter" class="d-flex flex-wrap gap-2"></div>
            <div class="search-box flex-grow-1">
                <i class="bi bi-search" aria-hidden="true"></i>
                <label for="deviceSearch" class="visually-hidden">Buscar dispositivo</label>
                <input type="search" id="deviceSearch" class="form-control form-control-sm" placeholder="Buscar por nome, host ou modelo..." autocomplete="off">
            </div>
        </div>
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
            <div class="results-count" id="resultsCount" aria-live="polite"></div>
            <div class="results-count" id="updateStatus" aria-live="polite"></div>
        </div>

        <div id="deviceList"></div>
    </main>

    <!-- Modal de cadastro/edição (só admin chega a abrir) -->
    <div class="modal fade" id="deviceModal" tabindex="-1" aria-labelledby="deviceModalTitle" aria-modal="true" role="dialog">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <form class="modal-content" id="deviceForm" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="deviceModalTitle">Novo dispositivo</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div id="deviceFormMessage" class="alert d-none" role="alert"></div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="fName" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="fName" name="name" maxlength="60" required placeholder="Ex.: AP-SALA">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="fModel" class="form-label">Modelo <span class="text-custom">(opcional)</span></label>
                            <input type="text" class="form-control" id="fModel" name="model" maxlength="100" placeholder="Ex.: TP-Link Deco M4R">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="fHost" class="form-label">Host (IP ou nome)</label>
                            <input type="text" class="form-control font-monospace-ip" id="fHost" name="host" maxlength="253" required placeholder="Ex.: 192.168.0.10" autocomplete="off" spellcheck="false">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-3">
                            <label for="fCheckType" class="form-label">Verificação</label>
                            <select class="form-select" id="fCheckType" name="checkType">
                                <option value="ping">Ping</option>
                                <option value="tcp">TCP (porta)</option>
                                <option value="http">HTTP (porta)</option>
                            </select>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-3" id="portGroup">
                            <label for="fPort" class="form-label">Porta</label>
                            <input type="number" class="form-control" id="fPort" name="port" min="1" max="65535" step="1" placeholder="Ex.: 80">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="fCategory" class="form-label">Categoria</label>
                            <select class="form-select" id="fCategory" name="categoryId"></select>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="fIcon" class="form-label">Ícone</label>
                            <select class="form-select" id="fIcon" name="icon"></select>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="fLatency" class="form-label">Limite de latência (ms)</label>
                            <input type="number" class="form-control" id="fLatency" name="latencyThresholdMs" min="1" max="10000" step="1" required>
                            <div class="form-text">Acima disso, o dispositivo fica em atenção (média das últimas medições).</div>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="fLoss" class="form-label">Limite de perda (%)</label>
                            <input type="number" class="form-control" id="fLoss" name="lossThresholdPct" min="1" max="100" step="1" required>
                            <div class="form-text">% de tentativas sem resposta. Em tcp/http, são conexões ou requisições que falharam.</div>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="fGateway" name="isGateway">
                                <label class="form-check-label" for="fGateway">É o gateway da rede</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="fEnabled" name="monitoringEnabled">
                                <label class="form-check-label" for="fEnabled">Monitorar este dispositivo</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="deviceSaveButton">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/rede.js"></script>
</body>
</html>
