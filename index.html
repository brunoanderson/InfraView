<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InfraView</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary" style="height: 100vh;">

    <main class="w-100 m-auto p-4 card shadow-sm border-0 login-card-anim" style="max-width: 400px;">
        <form action="dashboard.html" method="GET">
            <div class="text-center mb-4">
                <div class="login-brand-icon"><i class="bi bi-hdd-network"></i></div>
                <h1 class="h3 mb-3 fw-normal">InfraView</h1>
                <p class="text-muted">Monitoramento de Infraestrutura &amp; IoT &middot; Faça login para acessar o painel</p>
            </div>

            <div class="form-floating mb-3">
                <!-- Dado fictício já preenchido -->
                <input type="email" class="form-control" id="floatingInput" placeholder="nome@exemplo.com" value="admin@ifpb.edu.br">
                <label for="floatingInput">Endereço de E-mail</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Senha" value="senhafalsa123">
                <label for="floatingPassword">Senha</label>
            </div>

            <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Entrar no Painel</button>

            <div class="text-center mt-4">
                <small class="text-muted">Equipe: Vinícius, Bruno e Arthur</small>
            </div>
        </form>
    </main>

</body>
</html>
