<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | InfraView</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Arquivo CSS Externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page d-flex align-items-center py-4 bg-body-tertiary">

    <main class="login-card w-100 m-auto p-4 card shadow-sm border-0 login-card-anim">

        <header class="text-center mb-4">
            <div class="login-brand-icon"><i class="bi bi-hdd-network"></i></div>
            <h1 class="h3 mb-3 fw-normal">InfraView</h1>
            <p class="text-muted mb-0">Monitoramento de Infraestrutura &amp; IoT &middot; Faça login para acessar o painel</p>
        </header>

        <!-- Banner de erro visual: escondido por padrão, ativado via ui.js -->
        <div id="area-erro" class="alert alert-danger d-flex align-items-center d-none" role="alert" aria-live="assertive"></div>

        <!-- Login simulado: o submit é interceptado por main-index.js (preventDefault) -->
        <form id="form-login" novalidate>
            <div class="form-floating mb-3">
                <!-- Dado fictício já preenchido -->
                <input type="email" class="form-control" id="campo-email" name="email" placeholder="nome@exemplo.com" value="admin@ifpb.edu.br" autocomplete="username" required>
                <label for="campo-email">Endereço de E-mail</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="campo-senha" name="senha" placeholder="Senha" value="senhafalsa123" autocomplete="current-password" required>
                <label for="campo-senha">Senha</label>
            </div>

            <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Entrar no Painel</button>
        </form>

        <footer class="text-center mt-4">
            <small class="text-muted">Equipe: Vinícius, Bruno e Arthur</small>
        </footer>
    </main>

    <!-- Ponto de entrada da página: módulo ES, zero JS inline -->
    <script type="module" src="./js/main-index.js"></script>
</body>
</html>
